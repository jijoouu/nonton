[package]
name = "nonton-rust"
version = "1.0.0"
edition = "2021"
description = "Nonton — Ultra-Fast Unified Movie, TV & Anime Streaming Platform in Rust (Axum + Askama)"

[dependencies]
axum = "0.7"
tokio = { version = "1.42", features = ["full"] }
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "trace"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"     # Optimize for minimum binary size
lto = true          # Enable Link-Time Optimization
codegen-units = 1   # Maximize size & speed optimization
panic = "abort"     # Remove unwinding bloat
strip = true        # Strip debug symbols automatically

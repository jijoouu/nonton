{% extends "layout.html" %}

{% block title %}Watchlist Vault — N' Personal Library{% endblock %}

{% block content %}
<div class="bg-black text-white pt-28 pb-20 px-5 sm:px-10">
  <div class="mx-auto max-w-[1600px] space-y-12">
    <div class="flex flex-col justify-between gap-6 border-b border-white/15 pb-10 md:flex-row md:items-end">
      <div class="space-y-3">
        <div class="noth-paren">( Zero-Login Personal Vault )</div>
        <h1 class="text-4xl sm:text-6xl font-normal tracking-tight text-white leading-none">
          Saved Watchlist
        </h1>
        <p class="text-sm sm:text-base text-neutral-400 max-w-xl">
          Stored directly in your browser's local storage. Export or import JSON backups anytime.
        </p>
      </div>

      <div class="flex flex-wrap gap-3">
        <button id="export-json-btn" type="button" class="noth-pill noth-pill-outline-light">
          <span>EXPORT JSON</span>
        </button>
        <label class="noth-pill noth-pill-light cursor-pointer">
          <span>IMPORT JSON</span>
          <input id="import-json-input" type="file" accept=".json,application/json" class="hidden" />
        </label>
      </div>
    </div>

    <div id="watchlist-feedback" class="hidden rounded-full border border-white/30 bg-white/10 px-5 py-3 font-mono text-xs text-white"></div>

    <section class="space-y-6">
      <div id="watchlist-grid" class="grid grid-cols-2 gap-6 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6"></div>
    </section>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const grid = document.getElementById("watchlist-grid");
  const feedback = document.getElementById("watchlist-feedback");
  const exportBtn = document.getElementById("export-json-btn");
  const importInput = document.getElementById("import-json-input");

  const renderGrid = () => {
    const list = window.NontonStore.getState().watchlist || [];
    if (list.length === 0) {
      grid.innerHTML = `<div class="col-span-full rounded-2xl border border-white/15 py-20 text-center font-mono text-xs text-neutral-400">( Your Watchlist is currently empty — click "+ WATCHLIST" on any title )</div>`;
      return;
    }
    grid.innerHTML = list.map((item) => `
      <a href="/${item.media_type}/${item.id}" class="noth-media-card group flex flex-col">
        <div class="noth-media-frame aspect-[2/3]">
          <img src="${item.poster_url}" alt="${item.title}" class="noth-media-img" />
        </div>
        <div class="noth-media-meta">
          <span class="truncate text-sm font-medium text-white group-hover:translate-x-1 transition-transform">${item.title}</span>
          <span class="font-mono text-[11px] text-neutral-500">${item.release_year || ""}</span>
        </div>
      </a>
    `).join("");
  };

  renderGrid();

  exportBtn.addEventListener("click", () => {
    const json = JSON.stringify(window.NontonStore.getState(), null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "nonton-vault-backup.json";
    a.click();
    URL.revokeObjectURL(url);
    feedback.textContent = "( JSON BACKUP DOWNLOADED SUCCESSFULLY )";
    feedback.classList.remove("hidden");
  });

  importInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        window.NontonStore.saveState(parsed);
        renderGrid();
        feedback.textContent = "( WATCHLIST & HISTORY RESTORED SUCCESSFULLY )";
        feedback.classList.remove("hidden");
      } catch {
        feedback.textContent = "( INVALID JSON FILE )";
        feedback.classList.remove("hidden");
      }
    };
    reader.readAsText(file);
  });
});
</script>
{% endblock %}
